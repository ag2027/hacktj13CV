<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QML Rover Simulator</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --accent: #06b6d4;
      --accent2: #f59e0b;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 10% 10%, #1e293b, var(--bg) 45%);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }
    .card {
      width: min(760px, 95vw);
      background: linear-gradient(160deg, #0b1222, var(--panel));
      border: 1px solid #1f2937;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 20px 40px rgba(2, 6, 23, 0.55);
    }
    h1 {
      margin: 0 0 6px;
      font-size: 1.5rem;
      letter-spacing: .3px;
    }
    p { color: var(--muted); }
    .row { margin: 16px 0; }
    label { display: block; margin-bottom: 8px; }
    input[type="range"], textarea {
      width: 100%;
    }
    textarea {
      min-height: 90px;
      border-radius: 10px;
      background: #020617;
      color: var(--text);
      border: 1px solid #334155;
      padding: 10px;
      resize: vertical;
    }
    button {
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      color: #03121a;
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
      margin-right: 8px;
    }
    .result {
      margin-top: 18px;
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 14px;
      white-space: pre-wrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hybrid Rover QML Simulator</h1>
    <p>Test a PennyLane quantum machine learning decision engine for rover actions.</p>

    <div class="row">
      <label for="distance">Distance (cm): <span id="distanceValue">40</span></label>
      <input id="distance" type="range" min="2" max="100" value="40" />
    </div>

    <div class="row">
      <label for="turnHint">Turn hint (0=LEFT bias, 1=RIGHT bias): <span id="turnValue">0</span></label>
      <input id="turnHint" type="range" min="0" max="1" step="1" value="0" />
    </div>

    <div class="row">
      <button onclick="runSingle()">Run Single Decision</button>
    </div>

    <div class="row">
      <label for="series">Distance series (comma separated, cm)</label>
      <textarea id="series">80,65,40,28,18,10,25,45,70</textarea>
      <button onclick="runSeries()">Run Sequence</button>
    </div>

    <div class="result" id="result">Ready.</div>
  </div>

  <script>
    const distance = document.getElementById('distance');
    const turnHint = document.getElementById('turnHint');
    const distanceValue = document.getElementById('distanceValue');
    const turnValue = document.getElementById('turnValue');
    const result = document.getElementById('result');

    distance.addEventListener('input', () => distanceValue.textContent = distance.value);
    turnHint.addEventListener('input', () => turnValue.textContent = turnHint.value);

    async function runSingle() {
      const payload = {
        distance_cm: Number(distance.value),
        turn_hint: Number(turnHint.value)
      };
      const r = await fetch('/api/simulate', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
      });
      const data = await r.json();
      result.textContent = JSON.stringify(data, null, 2);
    }

    async function runSeries() {
      const items = document.getElementById('series').value
        .split(',')
        .map(s => s.trim())
        .filter(Boolean)
        .map(Number)
        .filter(x => !Number.isNaN(x));

      const payload = {
        distances: items,
        turn_hint: Number(turnHint.value)
      };

      const r = await fetch('/api/sequence', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
      });
      const data = await r.json();
      result.textContent = JSON.stringify(data, null, 2);
    }
  </script>
</body>
</html>
